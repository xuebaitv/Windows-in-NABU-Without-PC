name: Build Nabu-Installer ZIP

on:
  workflow_dispatch:
  
permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      - name: Install 7zip
        run: sudo apt-get update && sudo apt-get install -y p7zip-full

      - name: Resolve latest driver and UEFI assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/remtrik-stuff/MiPad5-Windows-Releases/releases/latest \
            -o latest-release.json

          DRIVER_URL=$(jq -r '.assets[] | select(.name | startswith("XiaomiPad5-Drivers-v") and endswith("-Desktop.7z")) | .browser_download_url' latest-release.json | head -n 1)
          UEFI_URL=$(jq -r '.assets[] | select(.name | startswith("XiaomiPad5.UEFI-v") and endswith(".img") and (contains("_nSB") | not)) | .browser_download_url' latest-release.json | head -n 1)

          if [ -z "$DRIVER_URL" ] || [ -z "$UEFI_URL" ]; then
            echo "Could not find driver/UEFI assets in the latest release" >&2
            jq -r '"Tag: \(.tag_name)", "Assets: \(([.assets[].name] | join(", ")))"' latest-release.json >&2
            exit 1
          fi

          BSP_TAG=$(jq -r .tag_name latest-release.json)
          if [[ ! "$BSP_TAG" =~ ^([0-9]{2})([0-9]{2})\.([0-9]{2}) ]]; then
            echo "Unexpected BSP tag format: $BSP_TAG" >&2
            exit 1
          fi
          BSP_DATE_COMPACT="${BASH_REMATCH[1]}${BASH_REMATCH[2]}${BASH_REMATCH[3]}"
          BSP_DATE_FULL="20${BASH_REMATCH[1]}_${BASH_REMATCH[2]}_${BASH_REMATCH[3]}"

          echo "Latest BSP: $BSP_TAG ($BSP_DATE_FULL)"
          echo "Driver: $DRIVER_URL"
          echo "UEFI: $UEFI_URL"
          echo "DRIVER_URL=$DRIVER_URL" >> $GITHUB_ENV
          echo "UEFI_URL=$UEFI_URL" >> $GITHUB_ENV
          echo "BSP_DATE_COMPACT=$BSP_DATE_COMPACT" >> $GITHUB_ENV
          echo "BSP_DATE_FULL=$BSP_DATE_FULL" >> $GITHUB_ENV

      - name: Set build date and artifact name
        run: |
          BUILD_DATE="$BSP_DATE_FULL"
          echo "BUILD_DATE=$BUILD_DATE" >> $GITHUB_ENV
          echo "ARTIFACT_NAME=nabu-wininstaller-$BSP_DATE_COMPACT" >> $GITHUB_ENV
          echo "ZIP_NAME=NABU_WinInstaller_${BSP_DATE_FULL}.zip" >> $GITHUB_ENV

      - name: Generate wininstaller.conf
        run: |
          cat << EOF > wininstaller.conf
          # ================================ Configurations ================================
          DEVICE_CODE="nabu"
          WIN_MIN_SIZE=30
          ESP_MIN_SIZE=345
          REQUIRED_BATTERY=50
          WIN_PART_NAME="WINNABU"
          ESP_PART_NAME="ESPNABU"
          SECURE_BOOT="TRUE"
          WINDOWS_EDITIONS=(
            "Windows 11 Pro"
            "Windows 11 IoT Enterprise LTSC 2024"
            "Windows 11 Enterprise LTSC 2024"
            "Windows 11 Enterprise"
            "Windows 11 Home"
            "Windows 10 Pro"
            "Windows 10 Home"
          )
          DEVICE_NAME="Xiaomi Pad 5"
          WI_VERSION="WinInstaller_NABU_R8.3.2"
          BUILD_DATE="$BUILD_DATE"
          MAINTAINER="Project-Aloha,map220v,remtrik And idk"
          # ============================== Configurations End ==============================
          EOF
  
      - name: Create temp and target directories
        run: |
          mkdir -p driver-temp
          mkdir -p checksum-temp
          mkdir -p installer/Driver
          mkdir -p ToolBox

      - name: Download drivers archive
        run: curl -L "$DRIVER_URL" -o driver.7z

      - name: Extract all drivers to temp folder
        run: 7z x driver.7z -odriver-temp

      - name: Copy selected directories into installer/Driver
        run: |
          for dir in components definitions tools apps; do
            find driver-temp -type d -name "$dir" -print0 |
              while IFS= read -r -d '' match; do
                echo "Copying: $match"
                cp -r "$match" installer/Driver/
              done
          done
          rm -rf installer/Driver/tools/DriverUpdater/X86 installer/Driver/tools/DriverUpdater/AMD64

      - name: Download uefi.img
        run: curl -L "$UEFI_URL" -o installer/uefi.img

      - name: Download pe.img
        run: |
          curl -L https://github.com/Kumar-Jy/WOAInstaller/releases/download/WinPE/WinPE23H2.img \
          -o installer/pe.img

      - name: Setup ToolBox
        run: |
          curl -L https://github.com/Misha803/My-Scripts/releases/download/WOA-ToolBox/WOA-Toolbox-NEW.exe \
          -o ToolBox/ToolBox.exe
          curl -L https://github.com/asheroto/Deploy-Office/releases/latest/download/Deploy-Office.exe \
          -o ToolBox/Deploy-Office.exe
          curl -L https://github.com/Kumar-Jy/WOAInstaller/releases/download/files/AtlasPlaybook_v0.5.0-hotfix.apbx \
          -o ToolBox/AtlasPlaybook.apbx
          curl -L https://github.com/Kumar-Jy/WOAInstaller/releases/download/files/AME.Beta.exe \
          -o ToolBox/AME-Wizard.exe
          curl -L https://github.com/Kumar-Jy/WOAInstaller/releases/download/files/Dism++10ARM.zip \
          -o ToolBox/Dism++.zip

      - name: Resolve latest WOA Helper APK
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            https://api.github.com/repos/n00b69/woa-helper/releases/latest \
            -o latest-woa-release.json

          WOAHELPER_URL=$(jq -r '[.assets[] | select((.name | ascii_downcase | endswith(".apk") and contains("woahelper")) and ((.name | ascii_downcase | (contains("debug") or contains("xold"))) | not))] | sort_by(.created_at) | reverse | .[0].browser_download_url // empty' latest-woa-release.json)

          if [ -z "$WOAHELPER_URL" ]; then
            echo "Could not find a stable WOA Helper APK in the latest release" >&2
            jq -r '"Tag: \(.tag_name)", "Assets: \(([.assets[].name] | join(", ")))"' latest-woa-release.json >&2
            exit 1
          fi

          echo "WOA Helper: $WOAHELPER_URL"
          echo "WOAHELPER_URL=$WOAHELPER_URL" >> $GITHUB_ENV

      - name: Download Woa-Helper
        run: curl -fL "$WOAHELPER_URL" -o woahelper.apk

      - name: Generate and copy SHA-256 checksums
        run: |
          cd installer && find . -type f -print0 | xargs -0 sha256sum > ../checksum-temp/sha256sum
          cp ../checksum-temp/sha256sum sha256sum

      - name: Cleanup temp folders
        continue-on-error: true
        run: |
          rm -rf driver-temp checksum-temp driver.7z

      - name: Upload installer artifacts
        uses: actions/upload-artifact@v7
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: |
            installer
            ToolBox
            META-INF
            wininstaller.conf
            woahelper.apk

      - name: Create Final ZIP
        run: |
          7z a "${ZIP_NAME}" installer ToolBox META-INF wininstaller.conf woahelper.apk

      - name: Upload release (GitHub Release)
        uses: softprops/action-gh-release@v3
        with:
          tag_name: Nabu-WinInstaller
          files: ${{ env.ZIP_NAME }}
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
